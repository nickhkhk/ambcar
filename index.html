<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>屯門救護車 A188</title>
<style>
:root{
  --ink:#1c2733; --paper:#ffffff; --muted:#5f6f80; --red:#e8323c; --go:#21b46b; --orange:#ff7a1a; --yellow:#ffe500; --blue:#1f4fbf;
  --font:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  /* 版面：直向全畫面 3D；頂部任務卡＋小地圖，底部單手操作掣；選單同結算係置中卡片 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:#c4e6fb;font-family:var(--font);color:var(--ink);overflow:hidden;touch-action:none;color-scheme:light}
canvas{display:block}
#stage{position:fixed;inset:0}
.show{display:flex!important}
#hudWrap{display:none}
.top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.card{background:rgba(255,255,255,.95);border-radius:16px;padding:9px 12px;box-shadow:0 3px 12px rgba(0,0,0,.12);font-size:13px;line-height:1.35}
.card b{font-size:15px;display:block}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.dist{color:var(--red)}
#mini{width:96px;height:96px;margin-left:auto;flex:none;border-radius:50%;box-shadow:0 3px 12px rgba(0,0,0,.18)}
#bAEB{pointer-events:auto;position:fixed;top:calc(152px + env(safe-area-inset-top));right:10px;border:0;border-radius:99px;background:rgba(255,255,255,.95);font:inherit;font-size:12px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#bAEB[aria-pressed=false]{color:#8a94a0}
#bMenu{pointer-events:auto;position:fixed;top:calc(118px + env(safe-area-inset-top));right:10px;border:0;border-radius:99px;background:rgba(255,255,255,.95);font:inherit;font-size:12px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btns{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end}
.btn{width:74px;height:74px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.18);font:inherit;font-size:26px;font-weight:800;color:var(--ink);display:grid;place-items:center;touch-action:none}
.btn.on{transform:scale(.93);background:#e9eef3}
.btn.go{background:var(--go);color:#fff;width:90px;height:90px;font-size:22px}
.btn.go.on{background:#1a9659}
.btn.small{width:58px;height:58px;font-size:20px}
.btn.horn{font-size:14px;color:var(--orange);border:3px solid var(--orange)}
.btn.horn.siren{background:var(--orange);color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.btn.horn.siren{animation:none}}
.lr,.right{display:flex;gap:10px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:10px}
#cap{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;max-width:min(92vw,420px);background:rgba(28,39,51,.88);color:#fff;font-size:16px;font-weight:700;padding:10px 16px;border-radius:14px;text-align:center;line-height:1.4}

.lives{font-size:20px;letter-spacing:1px;line-height:1;margin-bottom:4px}
.lives .on{color:#f5a623;text-shadow:0 1px 0 #c77d00}.lives .off{color:#d5dbe2}
.lives.hit{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.lives.hit{animation:none}}
#toast{position:fixed;left:50%;top:calc(160px + env(safe-area-inset-top));transform:translateX(-50%);display:none;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
#callBox{position:fixed;left:12px;right:12px;top:calc(122px + env(safe-area-inset-top));display:none;justify-content:center;pointer-events:none}
#callBox .card{border-left:6px solid var(--red);max-width:420px;font-size:14px}
.layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(28,39,51,.35)}
.panel{background:var(--paper);border-radius:22px;padding:18px;width:min(92vw,420px);box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.badge{background:var(--yellow);border:3px solid var(--blue);color:var(--blue);font-weight:900;border-radius:10px;padding:2px 8px;font-size:15px}
.panel h1{margin:0;font-size:22px;text-wrap:balance}
.panel p{margin:6px 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
#cases{display:grid;gap:10px}
.case{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;text-align:left;border:2px solid #e3e8ee;background:#fafbfc;border-radius:16px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.case .pl{font-size:12px;color:var(--muted);grid-column:1}
.case b{font-size:17px;grid-column:1}
.case .st{grid-column:2;grid-row:1/3;align-self:center;color:#f5a623;font-size:18px;letter-spacing:1px}
.case:active{border-color:var(--orange)}
.rules{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.rules b{color:var(--ink)}
.stars{font-size:44px;color:#f5a623;text-align:center;letter-spacing:4px;margin:6px 0}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;font-size:15px}
.pri{background:var(--red);color:#fff}.sec{background:#eef1f5;color:var(--ink)}
.tips{background:#fff7e0;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:10px}
.tips ul{margin:6px 0 0;padding-left:20px}.tips li{margin:3px 0}
.over h1{color:var(--red);text-align:center}
.credit{position:fixed;left:8px;bottom:calc(4px + env(safe-area-inset-bottom));font-size:9.5px;color:rgba(28,39,51,.55);pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;padding:0 10px calc(12px + env(safe-area-inset-bottom))}
.sheet .panel{border-radius:22px;max-height:70vh}
.qnum{font-size:12px;font-weight:800;color:var(--orange);letter-spacing:.5px}
#qText{font-size:18px;margin:4px 0 12px;line-height:1.4;text-wrap:balance}
#qOpts{display:grid;gap:8px}
.qo{border:2px solid #e3e8ee;background:#fafbfc;border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;text-align:left;color:var(--ink);cursor:pointer;line-height:1.35}
.qo.ok{border-color:var(--go);background:#e6f8ee}.qo.bad{border-color:var(--red);background:#fde9ea}
.qo:disabled{cursor:default;color:var(--ink)}
#qWhy{font-size:14px;line-height:1.5;margin:10px 0 0;color:var(--ink)}
#qNext{display:none;width:100%;margin-top:12px;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;font-size:15px;background:var(--red);color:#fff}
/* 選單分頁 */
.tabs{display:flex;gap:4px;margin:8px 0 10px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;border-radius:99px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;background:#eef1f5;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.case.locked{opacity:.55}
.case .meta{font-size:12px;color:var(--muted);grid-column:1}
.kcard{border:2px solid #e3e8ee;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.kcard b{display:block;margin-bottom:4px}.kcard ul{margin:4px 0 0;padding-left:18px}.kcard.lock{color:var(--muted);background:#f6f7f9}
.achl{display:grid;gap:8px}.achi{display:flex;gap:10px;align-items:center;border:2px solid #e3e8ee;border-radius:14px;padding:8px 12px;font-size:14px}
.achi .ic{font-size:22px}.achi.lock{opacity:.5}.achi small{display:block;color:var(--muted)}
.lvsel{display:flex;gap:4px;margin-bottom:8px}.lvsel button{flex:1;border:0;border-radius:10px;padding:6px 0;font:inherit;font-size:13px;background:#eef1f5}.lvsel button.on{background:var(--orange);color:#fff}
.board{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}.board td{padding:5px 4px;border-bottom:1px solid #eef1f5}.board td.n{font-weight:700}.board td.r{text-align:right;font-variant-numeric:tabular-nums}
.bhead{font-weight:800;font-size:13px;margin:8px 0 4px;color:var(--muted)}
.liv{display:flex;align-items:center;gap:10px;border:2px solid #e3e8ee;border-radius:14px;padding:8px 12px;margin-bottom:8px;width:100%;font:inherit;text-align:left;background:#fff}
.liv .sw{width:34px;height:22px;border-radius:6px;border:2px solid #1c2733}.liv.on{border-color:var(--orange)}.liv:disabled{opacity:.5}
.ach-new{text-align:center;color:#b26b00;font-size:14px;margin:4px 0}
.namerow{display:flex;gap:8px;margin:6px 0}.namerow input{flex:1;min-width:0;border:2px solid #e3e8ee;border-radius:12px;padding:9px 10px;font:inherit;font-size:15px}
.namerow button{border:0;border-radius:12px;padding:0 12px;font:inherit;font-weight:800;font-size:14px}
.wide{width:100%;margin-top:10px;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;font-size:15px}
.stab{position:fixed;left:10px;top:calc(124px + env(safe-area-inset-top));display:none;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.stab .bar{width:110px;height:9px;border-radius:99px;background:#e6eaef;overflow:hidden}.stab .bar i{display:block;height:100%;width:100%;background:var(--go);transition:width .2s}
.num.warn{color:var(--red)}
button:focus-visible{outline:3px solid #1d7bd8;outline-offset:2px}
</style>
</head>
<body>
<div id="pinGate" style="position:fixed;inset:0;z-index:2147483647;background:#0f1720;color:#fff;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang HK','Noto Sans TC',sans-serif">
<div style="width:min(320px,86vw);text-align:center">
<div style="font-size:20px;font-weight:700;margin-bottom:6px">請輸入 PIN</div>
<div style="font-size:13px;opacity:.7;margin-bottom:18px">只需輸入一次，之後呢部機會記住</div>
<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" style="width:100%;box-sizing:border-box;font-size:24px;letter-spacing:6px;text-align:center;padding:12px;border-radius:12px;border:1px solid #3a4756;background:#1b2632;color:#fff;outline:none">
<button id="pinBtn" style="width:100%;margin-top:12px;padding:12px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:#e23b3b;color:#fff">確定</button>
<div id="pinMsg" style="height:20px;margin-top:10px;font-size:14px;color:#ff8a8a"></div>
</div></div>
<script>
(function(){
  var H='4f00a732a628b0efdb29a102528f7aa5e8accfd2fb06a9f6fe3bea0589eb870e',K='pinGate.ok';
  var g=document.getElementById('pinGate'),i=document.getElementById('pinIn'),b=document.getElementById('pinBtn'),m=document.getElementById('pinMsg');
  function open(){g.remove();}
  try{ if(localStorage.getItem(K)===H){open();return;} }catch(e){}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('');}
  function check(){
    var v=(i.value||'').trim(); if(!v) return;
    if(!(window.crypto&&crypto.subtle)){m.textContent='呢個瀏覽器唔支援，請用 Safari 或 Chrome';return;}
    crypto.subtle.digest('SHA-256',new TextEncoder().encode('a188-pin:'+v)).then(function(d){
      if(hex(d)===H){ try{localStorage.setItem(K,H);}catch(e){} open(); }
      else { m.textContent='PIN 錯誤，請再試'; i.value=''; i.focus(); }
    });
  }
  b.onclick=check; i.onkeydown=function(e){if(e.key==='Enter')check();};
  setTimeout(function(){try{i.focus();}catch(e){}},100);
})();
</script>

<div id="stage"></div>

<div id="hudWrap">
  <div class="top">
    <div class="card"><div id="lives" class="lives" role="img" aria-label="生命之星"></div><b id="hTitle">任務</b><span id="hSub"></span><br>距離 <span class="num dist" id="hDist">--</span> · 限時 <span class="num" id="hTime">0:00</span></div>
    <canvas id="mini" width="192" height="192" aria-label="小地圖"></canvas>
  </div>
  <div id="stabBox" class="stab" role="img" aria-label="病人穩定度"><span>🛏️ 病人穩定度</span><div class="bar"><i id="stabBar"></i></div></div>
  <button id="bMenu" aria-label="返回選單">選單</button>
  <button id="bAEB" aria-label="自動防撞探測開關" aria-pressed="true">防撞 開</button>
  <div class="btns">
    <div class="lr"><button class="btn" id="bL" aria-label="左轉">◀</button><button class="btn" id="bR" aria-label="右轉">▶</button></div>
    <div class="right"><div class="col"><button class="btn small horn" id="bH" aria-label="警號開關" aria-pressed="false">警號</button><button class="btn small" id="bB" aria-label="倒車">倒</button></div><button class="btn go" id="bG" aria-label="油門">油</button></div>
  </div>
</div>
<div id="callBox"><div class="card" id="call"></div></div>
<div id="cap"></div>
<div id="toast"></div>

<div class="layer" id="menu">
  <div class="panel">
    <div class="brand"><span class="badge">A188</span><h1>屯門救護車</h1></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="levels">關卡</button><button role="tab" data-t="cards">知識卡</button><button role="tab" data-t="ach">成就</button><button role="tab" data-t="board">排行榜</button><button role="tab" data-t="livery">車款</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>

<div class="layer" id="result">
  <div class="panel">
    <h1 style="text-align:center">任務完成</h1>
    <div class="stars" id="rStars"></div>
    <p id="rTime" style="text-align:center;margin:0"></p>
    <p id="rNote" style="text-align:center"></p>
    <p id="rAch" class="ach-new"></p>
    <div class="namerow"><input id="rName" maxlength="12" placeholder="你嘅名" aria-label="排行榜名稱"><button id="rSave" class="pri">儲存到排行榜</button></div>
    <div class="tips" id="rTips"></div>
    <button class="pri wide" id="rNext">下一關</button>
    <div class="row"><button class="sec" id="rMenu">返回選單</button><button class="sec" id="rAgain">再玩一次</button></div>
  </div>
</div>

<div class="sheet" id="quiz" role="dialog" aria-labelledby="qText">
  <div class="panel">
    <div class="qnum" id="qNum">急救小測</div>
    <h2 id="qText"></h2>
    <div id="qOpts"></div>
    <p id="qWhy" aria-live="polite"></p>
    <button id="qNext">繼續</button>
  </div>
</div>

<div class="layer over" id="over">
  <div class="panel">
    <h1>遊戲結束</h1>
    <div class="stars" style="color:#d5dbe2">☆☆☆☆☆</div>
    <p style="text-align:center">5 粒生命之星已經扣晒。<br><span id="oWhy"></span><br>記住：唔好撞人撞車、衝紅燈要開警號。</p>
    <div class="row"><button class="sec" id="oMenu">返回選單</button><button class="pri" id="oAgain">再玩一次</button></div>
  </div>
</div>
<div class="credit">Q 版屯門 · 試玩版</div>

<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
